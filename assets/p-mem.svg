<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-label="AI Project Memory System: One GitHub memory space per project; Compact context files for AI agents; Rules, changelogs, decisions &amp; task history; Less tokens, more continuity across sessions"><title>AI Project Memory System: One GitHub memory space per project; Compact context files for AI agents; Rules, changelogs, decisions &amp; task history; Less tokens, more continuity across sessions</title><defs><linearGradient id="bdmem" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="360"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".45" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".55" stop-color="#f5f3ff" stop-opacity="0"/><stop offset="1" stop-color="#f5f3ff"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 310 180" to="360 310 180" dur="6s" repeatCount="indefinite"/></linearGradient>
