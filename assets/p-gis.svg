<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-label="GIS Detection Workflows: Aquaculture cages &amp; rafts from raster imagery; Denoise first — detection is the final step; Boxes, masks &amp; boundaries → GIS formats; Preserve spatial accuracy &amp; georeferencing"><title>GIS Detection Workflows: Aquaculture cages &amp; rafts from raster imagery; Denoise first — detection is the final step; Boxes, masks &amp; boundaries → GIS formats; Preserve spatial accuracy &amp; georeferencing</title><defs><linearGradient id="bdpgis" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="360"><stop offset="0" stop-color="#ff2e88"/><stop offset=".45" stop-color="#ff2e88" stop-opacity="0"/><stop offset=".55" stop-color="#f5f3ff" stop-opacity="0"/><stop offset="1" stop-color="#f5f3ff"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 310 180" to="360 310 180" dur="6s" repeatCount="indefinite"/></linearGradient>
