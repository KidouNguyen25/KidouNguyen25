<pattern id="dtpgis" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".07"/></pattern>
<clipPath id="cfpgis"><rect x="1" y="1" width="618" height="358" rx="18"/></clipPath></defs><style>.sans{font-family:'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif}.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace}
