.tg{font-size:12px;letter-spacing:3px;fill:#ff2e88}
.bl{font-family:'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:16px;fill:#cfcbe3}
.bi{font-size:14px;fill:#ff2e88}
.ch{font-size:11px;letter-spacing:1.5px;fill:#f5f3ff}
.ul{transform-box:fill-box;transform-origin:left;animation:ul 4s cubic-bezier(.7,0,.2,1) infinite}@keyframes ul{0%{transform:scaleX(0)}30%,80%{transform:scaleX(1)}100%{transform:scaleX(0);transform-origin:right}}
.b{opacity:0;animation:bin .6s ease-out both}@keyframes bin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.rd{animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(-360deg)}}
.bp{opacity:0;animation:bp 4s ease-out infinite}@keyframes bp{0%{opacity:1}60%{opacity:.2}100%{opacity:0}}</style>
