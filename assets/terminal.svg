<g class="v0"><text x="40" y="78" xml:space="preserve" class="mono tx"><tspan class="pr">kidou@uet:~$ </tspan><tspan class="cm">cat working_style.conf</tspan></text><g class="k0"><rect x="164.8" y="61" width="911.2" height="25" fill="#0a0913"/><rect x="165.8" y="63" width="9" height="19" fill="#c6ff3d" class="q0"/></g></g><text x="40" y="103" xml:space="preserve" class="mono tx v1" fill="#f5f3ff">  structure  = "logical"          tests   = "required"</text><text x="40" y="128" xml:space="preserve" class="mono tx v2" fill="#f5f3ff">  docs       = "always"           builds  = "reproducible"</text><text x="40" y="153" xml:space="preserve" class="mono tx v3" fill="#f5f3ff">  horizon    = "long-term"        context = "loss-resistant"</text><g class="v4"><text x="40" y="178" xml:space="preserve" class="mono tx"><tspan class="pr">kidou@uet:~$ </tspan><tspan class="cm">echo $PRIORITY</tspan></text><g class="k4"><rect x="164.8" y="161" width="834.4" height="25" fill="#0a0913"/><rect x="165.8" y="163" width="9" height="19" fill="#c6ff3d" class="q4"/></g></g><text x="40" y="203" xml:space="preserve" class="mono tx v5" fill="#c6ff3d">  correctness &gt; polish   # a project that works beats one that only looks complete</text><g class="v6"><text x="40" y="228" xml:space="preserve" class="mono tx"><tspan class="pr">kidou@uet:~$ </tspan><tspan class="cm">ls ./research</tspan></text><g class="k6"><rect x="164.8" y="211" width="824.8" height="25" fill="#0a0913"/><rect x="165.8" y="213" width="9" height="19" fill="#c6ff3d" class="q6"/></g></g><text x="40" y="253" xml:space="preserve" class="mono tx v7" fill="#00e5ff">  applied-cybersecurity/   cryptography-ctf/      geospatial-computer-vision/</text><text x="40" y="278" xml:space="preserve" class="mono tx v8" fill="#00e5ff">  ai-assisted-engineering/ local-models-agents/   gis-automation/</text><text x="40" y="303" xml:space="preserve" class="mono tx v9" fill="#00e5ff">  heritage-web-gis/        security-evidence/</text><g class="v10"