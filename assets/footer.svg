<clipPath id="fc"><rect width="1280" height="300" rx="18"/></clipPath></defs><style>.sans{font-family:'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif}.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace}
