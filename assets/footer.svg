.fin{font-size:12px;letter-spacing:4px;fill:#c6ff3d;animation:bk 1.4s steps(1) infinite}@keyframes bk{50%{opacity:.2}}</style>
<g clip-path="url(#fc)"><rect width="1280" height="300" fill="#07060d"/>
