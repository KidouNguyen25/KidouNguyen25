<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-label="Vauban Hanoi 360°: Five Vauban-style citadels around Hanoi; 37 × 360° photos placed on the map; View fan on map follows panorama heading; MAP / SPLIT / 360° modes, mobile-ready"><title>Vauban Hanoi 360°: Five Vauban-style citadels around Hanoi; 37 × 360° photos placed on the map; View fan on map follows panorama heading; MAP / SPLIT / 360° modes, mobile-ready</title><defs><linearGradient id="bdvb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="360"><stop offset="0" stop-color="#c6ff3d"/><stop offset=".45" stop-color="#c6ff3d" stop-opacity="0"/><stop offset=".55" stop-color="#f5f3ff" stop-opacity="0"/><stop offset="1" stop-color="#f5f3ff"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 310 180" to="360 310 180" dur="6s" repeatCount="indefinite"/></linearGradient>
